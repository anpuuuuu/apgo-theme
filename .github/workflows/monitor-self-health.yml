name: Monitoring self health
run-name: ${{ vars.MONITOR_SELF_HEALTH_SCOPE == 'ga4-only' && 'Legacy GA4 schedule watchdog' || 'Monitoring self health' }}

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      layer3_selftest:
        description: Also run Layer 3 beacon self-test
        type: boolean
        default: true
      rollout_validation:
        description: Skip Layer 1 and schedule freshness while Cron is intentionally disabled
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require health configuration
        env:
          MONITOR_WORKER_URL: ${{ vars.MONITOR_WORKER_URL }}
          MONITOR_HEARTBEAT_TOKEN: ${{ secrets.MONITOR_HEARTBEAT_TOKEN }}
          MONITOR_SITE_ID: apgo-my
          MONITOR_SELF_HEALTH_SCOPE: ${{ vars.MONITOR_SELF_HEALTH_SCOPE || 'all' }}
        run: |
          case "$MONITOR_SELF_HEALTH_SCOPE" in
            ga4-only) exit 0 ;;
            all) ;;
            *) echo "::error::Invalid MONITOR_SELF_HEALTH_SCOPE"; exit 1 ;;
          esac
          test -n "$MONITOR_WORKER_URL" || { echo "::error::MONITOR_WORKER_URL is required"; exit 1; }
          test -n "$MONITOR_HEARTBEAT_TOKEN" || { echo "::error::MONITOR_HEARTBEAT_TOKEN is required"; exit 1; }
      - name: Check Worker and Layer 1 heartbeat
        if: inputs.rollout_validation != true && vars.MONITOR_SELF_HEALTH_SCOPE != 'ga4-only'
        env:
          MONITOR_WORKER_URL: ${{ vars.MONITOR_WORKER_URL }}
          MONITOR_SITE_ID: apgo-my
        run: node monitoring/scripts/worker-health.mjs
      - name: Check scheduled workflow freshness
        if: always() && inputs.rollout_validation != true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MONITOR_SELF_HEALTH_SCOPE: ${{ vars.MONITOR_SELF_HEALTH_SCOPE || 'all' }}
        run: node monitoring/scripts/github-schedule-health.mjs
      - name: Refresh Layer 3 beacon self-test
        if: always() && inputs.rollout_validation != true && vars.MONITOR_SELF_HEALTH_SCOPE != 'ga4-only'
        env:
          MONITOR_WORKER_URL: ${{ vars.MONITOR_WORKER_URL }}
          MONITOR_HEARTBEAT_TOKEN: ${{ secrets.MONITOR_HEARTBEAT_TOKEN }}
          MONITOR_SITE_ID: apgo-my
        run: node monitoring/scripts/layer3-self-test.mjs
      - name: Notify self-monitoring failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_TITLE: ${{ vars.MONITOR_SELF_HEALTH_SCOPE == 'ga4-only' && 'APGO legacy GA4 schedule watchdog failed' || 'APGO monitoring self-health failed' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node monitoring/scripts/workflow-failure-notify.mjs
